name: Uptime check

# A basic, free, in-repo uptime probe of production. It is a floor, not a
# replacement for a real external monitor: GitHub runs scheduled workflows
# best-effort (often 5-15 min late, occasionally skipped under load) and
# disables them after 60 days without repository activity. Pair it with an
# external monitor (Better Stack, UptimeRobot, etc.) hitting the same URLs —
# see docs/OBSERVABILITY.md.
#
# Configure under Settings -> Secrets and variables -> Actions -> Variables:
#   UPTIME_API_URL       e.g. https://<backend>.up.railway.app    (probes /ready)
#   UPTIME_FRONTEND_URL  e.g. https://<frontend>.up.railway.app   (probes /)
#   UPTIME_ML_URL        e.g. https://<ml-service>.up.railway.app (probes /)
# Any that are unset are skipped. A failed run notifies via GitHub's normal
# workflow-failure notifications, and opens (or comments on) one tracking
# issue labelled `uptime` so an outage is visible to everyone, not just
# whoever last touched this file.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: uptime
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe production endpoints
        id: probe
        env:
          API: ${{ vars.UPTIME_API_URL }}
          FRONTEND: ${{ vars.UPTIME_FRONTEND_URL }}
          ML: ${{ vars.UPTIME_ML_URL }}
        run: |
          failures=""
          probe() {
            local name="$1" url="$2"
            [ -z "$url" ] && { echo "::notice::$name URL not configured, skipped"; return; }
            # Two attempts, 20s apart, so a single dropped packet or a
            # deploy's container swap doesn't page anyone.
            for attempt in 1 2; do
              rm -f /tmp/body; touch /tmp/body
              # curl already prints 000 on connection failure; `|| true` only
              # stops its non-zero exit from aborting the step.
              code=$(curl -s -o /tmp/body -w '%{http_code}' --max-time 15 "$url" || true)
              if [ "$code" -ge 200 ] && [ "$code" -lt 400 ]; then
                echo "$name OK ($code) $url"; return
              fi
              [ "$attempt" = 1 ] && sleep 20
            done
            echo "::error::$name DOWN ($code) $url: $(head -c 300 /tmp/body | tr -s '\n\r' ' ')"
            failures="$failures\n- **$name** \`$url\` -> HTTP $code"
          }
          probe "API readiness (DB reachable)" "${API:+${API%/}/ready}"
          probe "Frontend" "${FRONTEND:+${FRONTEND%/}/}"
          probe "ML service" "${ML:+${ML%/}/}"
          if [ -n "$failures" ]; then
            { echo "failures<<EOF"; echo -e "$failures"; echo "EOF"; } >> "$GITHUB_OUTPUT"
            exit 1
          fi

      - name: Open or update the outage issue
        if: failure() && steps.probe.outputs.failures != ''
        uses: actions/github-script@v7
        env:
          FAILURES: ${{ steps.probe.outputs.failures }}
        with:
          script: |
            const title = "Production uptime check failing";
            const body = `${process.env.FAILURES}\n\nRun: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\nTime: ${new Date().toISOString()}`;
            const { data: open } = await github.rest.issues.listForRepo({ ...context.repo, state: "open", labels: "uptime" });
            if (open.length) {
              await github.rest.issues.createComment({ ...context.repo, issue_number: open[0].number, body });
            } else {
              await github.rest.issues.create({ ...context.repo, title, body, labels: ["uptime"] });
            }
