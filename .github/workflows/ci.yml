name: CI

# Quality gate. Runs on every pull request and on pushes to main.
# `deploy.yml` will not build or ship an image unless this workflow passes.

on:
  pull_request:
    branches: ["**"]
  # Not `push: main` — deploy.yml runs on that and calls this workflow, so
  # adding it here would run every check twice on each merge.
  workflow_call: # allows deploy.yml to depend on this exact definition

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Prisma needs a syntactically valid URL to generate the client.
  # No database is contacted by generate/type-check/unit tests.
  POOLED_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ahava_ci
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ahava_ci

jobs:
  backend:
    name: Backend — type-check, lint, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      # pnpm-lock.yaml was regenerated after the root Vite/Capacitor app was
      # removed (AH-16/AH-17), so this is safe to pin: CI now catches real
      # dependency drift instead of silently re-resolving it (AH-39).
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @ahava-healthcare/api prisma:generate

      - name: Type-check
        run: pnpm --filter @ahava-healthcare/api exec tsc --noEmit

      - name: Lint
        run: pnpm --filter @ahava-healthcare/api lint

      - name: Unit tests
        run: pnpm --filter @ahava-healthcare/api test

      - name: Build
        run: pnpm --filter @ahava-healthcare/api build

  ml-service:
    name: ML service — pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # DATABASE_URL is deliberately left unset: db.py falls back to an
      # in-process dict store whenever it's unset, so the suite (see
      # tests/conftest.py) exercises the real ingest/evaluate path without
      # needing TimescaleDB/Postgres in CI.
      - name: Install dependencies
        working-directory: apps/ml-service
        run: |
          pip install -r requirements.txt
          pip install pytest

      - name: Run tests
        working-directory: apps/ml-service
        run: pytest -q

  frontend:
    name: Frontend — lint and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      # pnpm-lock.yaml was regenerated after the root Vite/Capacitor app was
      # removed (AH-16/AH-17), so this is safe to pin: CI now catches real
      # dependency drift instead of silently re-resolving it (AH-39).
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm --filter workspace lint

      - name: Unit tests
        run: pnpm --filter workspace test

      - name: Build
        env:
          NEXT_OUTPUT_STANDALONE: "false"
          BACKEND_URL: http://localhost:4000
        run: pnpm --filter workspace build

  migrations:
    name: Migrations apply cleanly
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ahava_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      # pnpm-lock.yaml was regenerated after the root Vite/Capacitor app was
      # removed (AH-16/AH-17), so this is safe to pin: CI now catches real
      # dependency drift instead of silently re-resolving it (AH-39).
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Drift check first, while the database is still empty: replays the
      # migration history into a shadow database and compares the result to
      # schema.prisma. Exits non-zero if they disagree.
      - name: Check schema matches migrations
        run: |
          pnpm --filter @ahava-healthcare/api exec prisma migrate diff \
            --from-migrations prisma/migrations \
            --to-schema-datamodel prisma/schema.prisma \
            --shadow-database-url "$DATABASE_URL" \
            --exit-code

      # Proves the migration history replays from empty onto a real Postgres.
      - name: Apply migrations
        run: pnpm --filter @ahava-healthcare/api exec prisma migrate deploy

  integration:
    name: Backend — integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ahava_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      # Only the webhook-replay-protection tests use this (they call
      # initializeRedis() themselves in a beforeAll — NODE_ENV=test skips
      # index.ts's own Redis startup for every other test) — see
      # webhookReplayGuard.ts and webhooks.integration.test.ts. Every other
      # integration test already passes with no Redis reachable at all,
      # exercising the app's fail-open behavior, which is the point.
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # AH-07: DATABASE_URL is already set (this job's env, above), so
      # testSetup/globalSetup.js skips spinning up its own embedded-postgres
      # (that path exists for running these same tests locally without
      # Docker) and applies migrations to this real service container
      # instead — one real database, same as production, not a mock.
      - name: Integration tests
        run: pnpm --filter @ahava-healthcare/api test:integration

  dependency-audit:
    name: Dependency audit (production deps)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      # Production dependencies only: dev tooling (eslint, jest, vitest,
      # puppeteer) never ships in either Docker image. High/critical fails
      # the build so a repeat of the 2026-09 audit (110 findings, including
      # two Next.js RCEs) can't accumulate silently again. Transitive fixes
      # live in the root package.json `pnpm.overrides`.
      - name: pnpm audit (workspace + frontend)
        run: pnpm audit --prod --audit-level=high

      # The backend Docker image installs from apps/backend/package-lock.json
      # with `npm ci`, not from pnpm-lock.yaml — so the pnpm audit above does
      # not cover what actually ships for the API. Its transitive fixes live
      # in apps/backend/package.json `overrides` (npm's equivalent).
      - name: npm audit (backend image lockfile)
        working-directory: apps/backend
        run: npm audit --omit=dev --audit-level=high --workspaces=false

  e2e:
    name: End-to-end (browser → API → Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ahava_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # e2e/run.mjs uses this instead of starting its own embedded Postgres.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ahava_e2e
      POOLED_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ahava_e2e
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @ahava-healthcare/api prisma:generate

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      # Migrates, starts the API and a production Next.js build, then drives
      # a real browser (desktop + mobile viewport) through signup → login →
      # symptom check → consent → doctor's queue.
      - name: End-to-end tests
        run: pnpm test:e2e

      - name: Upload traces, screenshots and server logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: e2e/test-results/
          retention-days: 7
